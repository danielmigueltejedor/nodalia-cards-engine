name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Verify tag and integration version
        run: python -c 'import json, os; version=json.load(open("custom_components/nodalia/manifest.json"))["version"]; tag=os.environ["GITHUB_REF_NAME"].removeprefix("v"); assert version == tag, f"Tag {tag} does not match manifest {version}"'

      - name: Validate integration
        run: |
          python -m compileall -q custom_components/nodalia
          python -m unittest discover -s tests/python -p 'test_*.py'
          python -m unittest discover -s tests -p 'test_repository.py'

      - name: Extract changelog release notes
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import re

          version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          section = re.search(
              rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|\Z)",
              changelog, re.MULTILINE | re.DOTALL,
          )
          assert section is not None, f"Missing changelog section for {version}"
          notes = section.group(1).strip()
          assert notes, f"Empty changelog section for {version}"
          Path("release-notes.md").write_text(notes + "\n", encoding="utf-8")
          PY

      - name: Publish GitHub release
        shell: bash
        run: |
          release_args=(--verify-tag --notes-file release-notes.md --title "${GITHUB_REF_NAME#v}")
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" "${release_args[@]}"
