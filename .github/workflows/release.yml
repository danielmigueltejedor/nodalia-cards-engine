name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@a309fa6e53e99073ff7a8a6f2e4224e64e6c9f40 # v6.0.1
        with:
          python-version: "3.13"

      - name: Verify tag and integration version
        run: python -c 'import json, os; version=json.load(open("custom_components/nodalia/manifest.json"))["version"]; tag=os.environ["GITHUB_REF_NAME"].removeprefix("v"); assert version == tag, f"Tag {tag} does not match manifest {version}"'

      - name: Validate integration
        run: |
          python -m compileall -q custom_components/nodalia
          python -m unittest discover -s tests/python -p 'test_*.py'
          python -m unittest discover -s tests -p 'test_repository.py'

      - name: Publish GitHub release
        shell: bash
        run: |
          release_args=(--verify-tag --generate-notes --title "${GITHUB_REF_NAME#v}")
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" "${release_args[@]}"
